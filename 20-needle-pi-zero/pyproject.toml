[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "needle-pi-zero-benchmark"
version = "0.1.0"
description = "Reproducible Needle 2 tool-calling benchmark for Raspberry Pi Zero 2 W"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
